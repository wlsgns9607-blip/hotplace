<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>핫플레이스 입지 생활인구 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
  <header>
    <h1>📍 핫플레이스 입지 분석 (서울시 생활인구)</h1>
    <p class="sub">행정동별 24시간 생활인구 추이, 주중/주말 및 성별 패턴과 서울시/자치구 평균을 비교 분석합니다.</p>
  </header>

  <div class="controls card" style="display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap;">
    <div style="display: flex; align-items: center; gap: 0.5rem;">
      <label for="guSelect"><b>자치구 선택:</b></label>
      <select id="guSelect" style="padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.95rem;"></select>
    </div>
    <div style="display: flex; align-items: center; gap: 0.5rem;">
      <label for="dongSelect"><b>행정동 선택:</b></label>
      <select id="dongSelect" style="padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.95rem;"></select>
    </div>
  </div>

  <main class="card">
    <section>
      <h2>0. 서울시 전체 지역평균 유동인구 현황</h2>
      <div class="kpi" id="seoulKpi"></div>
      <canvas id="seoulChart" height="100"></canvas>
      <div class="notes" id="seoulNotes"></div>
    </section>

    <section>
      <h2>1. 시간대별 총 생활인구 추이</h2>
      <div class="kpi" id="kpiContainer"></div>
      <canvas id="lineChart" height="100"></canvas>
    </section>

    <section>
      <h2>2. 주중 vs 주말 인구 패턴</h2>
      <canvas id="barChart" height="90"></canvas>
    </section>

    <section>
      <h2>3. 성별 인구 비중</h2>
      <div class="pie-wrap">
        <canvas id="pieChart"></canvas>
      </div>
    </section>

    <section>
      <h2>4. 선택 행정동 vs 자치구 평균 비교</h2>
      <canvas id="guChart" height="100"></canvas>
      <div class="notes" id="guNotes"></div>
    </section>

    <section>
      <h2>💡 입지 분석 인사이트 요약</h2>
      <div class="notes" id="notes"></div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
